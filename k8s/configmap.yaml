apiVersion: v1
kind: ConfigMap
metadata:
  name: nailshop-config
  namespace: nailshop
data:
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  PAYMENT_CHECKOUT_BASE_URL: "https://payments.example.com/checkout"
  GOOGLE_OAUTH_REDIRECT_URI: "http://localhost:8000/app/auth/google/callback"
  CORS_ALLOWED_ORIGINS: "*"
  ALLOWED_HOSTS: "*"
