# Non-secret settings. Replace the nailzinc.co.uk domains with your own before
# deploying - the app logs "INSECURE FOR PRODUCTION" warnings at startup for
# anything left unsafe here. Secrets live in k8s/secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nailshop-config
  namespace: nailshop
data:
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "720"

  # Which websites may call this API from a browser, and which Host headers it
  # answers to. Never "*" in production.
  CORS_ALLOWED_ORIGINS: "https://nailzinc.co.uk"
  ALLOWED_HOSTS: "api.nailzinc.co.uk"
  FRONTEND_URL: "https://nailzinc.co.uk"
  BACKEND_PUBLIC_URL: "https://api.nailzinc.co.uk"

  GOOGLE_OAUTH_REDIRECT_URI: "https://api.nailzinc.co.uk/app/auth/google/callback"
  FACEBOOK_OAUTH_REDIRECT_URI: "https://api.nailzinc.co.uk/app/auth/facebook/callback"
  PAYMENT_CHECKOUT_BASE_URL: "https://payments.example.com/checkout"

  # Behind an ingress, rate limiting needs the forwarded client IP.
  TRUST_PROXY_HEADERS: "true"
  SQL_ECHO: "false"

  # Real delivery. Email is free and covers the whole app on its own; SMS is
  # optional and charged per message, so email wins when a customer has both.
  NOTIFICATION_BACKEND: "live"
  SMTP_HOST: "smtp-relay.brevo.com"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  EMAIL_FROM_ADDRESS: "hello@nailzinc.co.uk"
  EMAIL_FROM_NAME: "Nailzinc"
  PREFER_EMAIL_OVER_SMS: "true"
  SMS_COUNTRY_CODE: "+44"

  SHOP_TIMEZONE: "Europe/London"
