# Template only - copy to secret.yaml (gitignored) and fill in real values,
# or create directly with:
#   kubectl create secret generic nailshop-secrets -n nailshop \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET_KEY=... (etc.)
apiVersion: v1
kind: Secret
metadata:
  name: nailshop-secrets
  namespace: nailshop
type: Opaque
stringData:
  # In-cluster demo Postgres/Redis (see postgres.yaml / redis.yaml) - real values for the kind demo
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/nailshop"
  REDIS_URL: "redis://redis:6379/0"
  # Everything below is a placeholder - replace with real values for features that need them
  JWT_SECRET_KEY: "change-me-to-a-long-random-secret"
  PAYMENT_WEBHOOK_SECRET: "change-me-to-a-long-random-secret"
  CLOUDINARY_CLOUD_NAME: "your-cloud-name"
  CLOUDINARY_API_KEY: "your-api-key"
  CLOUDINARY_API_SECRET: "your-api-secret"
  GOOGLE_OAUTH_CLIENT_ID: "your-client-id.apps.googleusercontent.com"
  GOOGLE_OAUTH_CLIENT_SECRET: "your-client-secret"
  FACEBOOK_APP_ID: "your-facebook-app-id"
  FACEBOOK_APP_SECRET: "your-facebook-app-secret"
  # Email delivery - SMTP credentials from a free provider (Brevo, Resend,
  # Mailgun, or a Gmail app password). Host and port live in the configmap.
  SMTP_USERNAME: "your-smtp-username"
  SMTP_PASSWORD: "your-smtp-password"
  # Alternative to SMTP: SendGrid's API (takes priority when set)
  SENDGRID_API_KEY: ""
  # SMS delivery (Twilio, paid). Leave blank to run on email alone.
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_SENDER: ""
