# In-cluster Redis for the local kind demo only. Local dev and prod use a
# managed Redis instance (Upstash) instead of running this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nailshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nailshop
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
