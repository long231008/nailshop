apiVersion: apps/v1
kind: Deployment
metadata:
  name: nailshop-api
  namespace: nailshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nailshop-api
  template:
    metadata:
      labels:
        app: nailshop-api
    spec:
      containers:
        - name: nailshop-api
          image: nailshop-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nailshop-config
            - secretRef:
                name: nailshop-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
