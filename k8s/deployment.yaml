apiVersion: apps/v1
kind: Deployment
metadata:
  name: nailshop-api
  namespace: nailshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nailshop-api
  template:
    metadata:
      labels:
        app: nailshop-api
    spec:
      containers:
        - name: nailshop-api
          image: nailshop-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nailshop-config
            - secretRef:
                name: nailshop-secrets
          # The container runs "alembic upgrade head" before uvicorn; the
          # startup probe gives migrations up to ~150s before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            # Design photos land here when Cloudinary is not configured; without
            # a shared volume each replica keeps its own files and loses them on
            # restart. RWO works on the single-node kind demo - a multi-node
            # cluster needs RWX storage or (better) real Cloudinary credentials.
            - name: uploads-data
              mountPath: /code/uploads
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: nailshop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
